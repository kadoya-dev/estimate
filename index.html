    <script>
      const countryInput = document.getElementById("country");
      const lengthInput = document.getElementById("length");
      const widthInput = document.getElementById("width");
      const heightInput = document.getElementById("height");
      const weightInput = document.getElementById("weight");
      const totalOutput = document.getElementById("totalPrice");
      const totalUnit = document.getElementById("totalUnit");
      const optionToggle = document.getElementById("optionToggle");
      const optionPanel = document.getElementById("optionPanel");
      const simulateButton = document.getElementById("simulateButton");
      const inputScreen = document.getElementById("inputScreen");
      const resultScreen = document.getElementById("resultScreen");
      const planInput = document.getElementById("plan");
      const inspectionInput = document.getElementById("inspectionCount");
      const packingInput = document.getElementById("packingCount");
      const exportCartonInput = document.getElementById("exportCarton");
      const invoiceInput = document.getElementById("invoiceIssue");
      const returnInsuranceInput = document.getElementById("returnInsurance");
      const cargoInsuranceInput = document.getElementById("cargoInsurance");
      const insuredValueInput = document.getElementById("insuredValue");
      const estimateButton = document.getElementById("estimateButton");
      const retryButton = document.getElementById("retryButton");
      const estimateModal = document.getElementById("estimateModal");
      const closeModal = document.getElementById("closeModal");
      const createPdf = document.getElementById("createPdf");
      const companyNameInput = document.getElementById("companyName");
      const companyError = document.getElementById("companyError");
      const logOutput = document.getElementById("logOutput");
      const inputError = document.getElementById("inputError");

      const PRICE_PER_KG = 2000;
      const VOLUME_DIVISOR = 5000;
      const GAS_ENDPOINT =
        "https://script.google.com/macros/s/AKfycbzvZLNaOTOeko6ylWC3MSUDEgdKLaHk4CFLBCNeFcdRxVvK-jKUU1lDNpAVVdwQ8Kt6rA/exec";
      const PLAN_FEES = {
        worldShip: 0,
        worldShipForBiz: 1200,
        LOGIFIT: 1800,
      };
      const INSPECTION_FEE_PER_ITEM = 200;
      const PACKING_FEE_PER_ITEM = 300;
      const EXPORT_CARTON_FEE = 500;
      const INVOICE_FEE = 300;
      const RETURN_INSURANCE_FEE = 400;
      const CARGO_INSURANCE_RATE = 0.02;
      const CARGO_INSURANCE_MESSAGE =
        "運送保険を利用する場合は商品価格をご入力ください";

      const formatNumber = (value) => value.toLocaleString("ja-JP");
      const clamp = (value, min, max) =>
        Math.min(max, Math.max(min, value));
      const logMessage = (message) => {
        if (!logOutput) {
          return;
        }
        const timestamp = new Date().toLocaleTimeString("ja-JP");
        const current =
          logOutput.textContent === "待機中..." ? "" : logOutput.textContent;
        logOutput.textContent = `${current}${current ? "\n" : ""}${timestamp} ${message}`;
      };
      const logErrorDetails = (label, error) => {
        if (!error) {
          logMessage(`${label}: 不明なエラー`);
          return;
        }
        logMessage(`${label}: ${error.name || "Error"} - ${error.message || error}`);
        if (error.stack) {
          logMessage(`${label} stack: ${error.stack}`);
        }
      };

      window.addEventListener("error", (event) => {
        logMessage(
          `window.error: ${event.message} (${event.filename}:${event.lineno}:${event.colno})`
        );
      });
      window.addEventListener("unhandledrejection", (event) => {
        logErrorDetails("unhandledrejection", event.reason);
      });

      const countryOptions = Array.isArray(COUNTRY_NAMES)
        ? COUNTRY_NAMES
        : [];
      countryOptions.forEach((country, index) => {
        const option = document.createElement("option");
        option.value = country.value;
        option.textContent = country.label;
        option.selected = index === 0;
        countryInput.appendChild(option);
      });

      const updateOptionToggleText = () => {
        optionToggle.textContent = optionPanel.hidden
          ? "オプション項目を表示"
          : "オプション項目を非表示";
      };

      optionToggle.addEventListener("click", () => {
        optionPanel.hidden = !optionPanel.hidden;
        updateOptionToggleText();
      });

      const updateCargoInsuranceState = () => {
        const enabled = cargoInsuranceInput.checked;
        insuredValueInput.disabled = !enabled;
        insuredValueInput.required = enabled;
        if (!enabled) {
          insuredValueInput.value = "";
        }
      };

      cargoInsuranceInput.addEventListener("change", () => {
        updateCargoInsuranceState();
        calculate();
      });

      let latestRequestId = 0;

      const setInputError = (message) => {
        if (!inputError) {
          return;
        }
        if (message) {
          inputError.textContent = message;
          inputError.hidden = false;
        } else {
          inputError.textContent = "";
          inputError.hidden = true;
        }
      };

      const setSimulationPending = () => {
        totalOutput.textContent = "計算中...";
        totalOutput.classList.add("total-price-pending");
        totalOutput.classList.remove("total-price-message");
        totalUnit.textContent = "";
      };

      const setInitialSimulationDisplay = () => {
        totalOutput.textContent = "ー";
        totalOutput.classList.remove("total-price-pending");
        totalOutput.classList.remove("total-price-message");
        totalUnit.textContent = "円";
      };

      const extractShippingTotal = (data) => {
        if (!data || typeof data !== "object") {
          return null;
        }
        if (typeof data.shipping === "number") {
          return data.shipping;
        }
        if (typeof data.shippingFee === "number") {
          return data.shippingFee;
        }
        if (typeof data.simulationTotal === "number") {
          return data.simulationTotal;
        }
        return null;
      };

      const calculate = () => {
        const length = Number(lengthInput.value);
        const width = Number(widthInput.value);
        const height = Number(heightInput.value);
        const weight = Number(weightInput.value);

        const volumetric = (length * width * height) / VOLUME_DIVISOR;
        const billable = Math.max(weight, Math.ceil(volumetric));
        const baseTotal = billable * PRICE_PER_KG;

        const inspectionCount = clamp(
          Number(inspectionInput.value || 0),
          0,
          99
        );
        const packingCount = clamp(Number(packingInput.value || 0), 0, 99);
        inspectionInput.value = inspectionCount;
        packingInput.value = packingCount;

        const planFee = PLAN_FEES[planInput.value] ?? 0;
        const inspectionFee = inspectionCount * INSPECTION_FEE_PER_ITEM;
        const packingFee = packingCount * PACKING_FEE_PER_ITEM;
        const exportFee = exportCartonInput.checked ? EXPORT_CARTON_FEE : 0;
        const invoiceFee = invoiceInput.checked ? INVOICE_FEE : 0;
        const returnInsuranceFee = returnInsuranceInput.checked
          ? RETURN_INSURANCE_FEE
          : 0;
        const insuredValue = cargoInsuranceInput.checked
          ? Number(insuredValueInput.value || 0)
          : 0;
        if (cargoInsuranceInput.checked && insuredValue <= 0) {
          return { billable, total: null, hasError: true };
        }
        const cargoInsuranceFee = cargoInsuranceInput.checked
          ? Math.ceil(insuredValue * CARGO_INSURANCE_RATE)
          : 0;

        const optionTotal =
          planFee +
          inspectionFee +
          packingFee +
          exportFee +
          invoiceFee +
          returnInsuranceFee +
          cargoInsuranceFee;
        const total = baseTotal + optionTotal;
        return { billable, total, hasError: false };
      };

      [
        lengthInput,
        widthInput,
        heightInput,
        weightInput,
        planInput,
        inspectionInput,
        packingInput,
        exportCartonInput,
        invoiceInput,
        returnInsuranceInput,
        insuredValueInput,
      ].forEach((input) => {
        input.addEventListener("change", calculate);
        input.addEventListener("input", calculate);
      });

      updateOptionToggleText();
      updateCargoInsuranceState();
      calculate();
      setInitialSimulationDisplay();
      const initialValues = {
        country: countryInput.value,
        length: lengthInput.value,
        width: widthInput.value,
        height: heightInput.value,
        weight: weightInput.value,
        plan: planInput.value,
        inspectionCount: inspectionInput.value,
        packingCount: packingInput.value,
        exportCarton: exportCartonInput.checked,
        invoiceIssue: invoiceInput.checked,
        returnInsurance: returnInsuranceInput.checked,
        cargoInsurance: cargoInsuranceInput.checked,
        insuredValue: insuredValueInput.value,
      };

      const resetInputs = () => {
        countryInput.value = initialValues.country;
        lengthInput.value = initialValues.length;
        widthInput.value = initialValues.width;
        heightInput.value = initialValues.height;
        weightInput.value = initialValues.weight;
        planInput.value = initialValues.plan;
        inspectionInput.value = initialValues.inspectionCount;
        packingInput.value = initialValues.packingCount;
        exportCartonInput.checked = initialValues.exportCarton;
        invoiceInput.checked = initialValues.invoiceIssue;
        returnInsuranceInput.checked = initialValues.returnInsurance;
        cargoInsuranceInput.checked = initialValues.cargoInsurance;
        insuredValueInput.value = initialValues.insuredValue;
        optionPanel.hidden = true;
        updateOptionToggleText();
        updateCargoInsuranceState();
        calculate();
        setInitialSimulationDisplay();
      };

      const openModal = () => {
        estimateModal.hidden = false;
        companyError.hidden = true;
        companyNameInput.focus();
      };

      const closeEstimateModal = () => {
        estimateModal.hidden = true;
      };

      estimateButton.addEventListener("click", openModal);
      closeModal.addEventListener("click", closeEstimateModal);
      estimateModal.addEventListener("click", (event) => {
        if (event.target === estimateModal) {
          closeEstimateModal();
        }
      });

      retryButton.addEventListener("click", () => {
        resultScreen.hidden = true;
        inputScreen.hidden = false;
        setInputError("");
        resetInputs();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

      createPdf.addEventListener("click", () => {
        const companyName = companyNameInput.value.trim();
        if (!companyName) {
          companyError.hidden = false;
          companyNameInput.focus();
          return;
        }
        companyError.hidden = true;
        const totalPrice = totalOutput.textContent;
        const previewWindow = window.open("", "_blank");
        if (!previewWindow) {
          return;
        }
        previewWindow.document.write(`
          <!DOCTYPE html>
          <html lang="ja">
            <head>
              <meta charset="utf-8" />
              <title>法人向け見積書</title>
              <style>
                body {
                  font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
                  padding: 32px;
                  color: #151515;
                }
                h1 {
                  font-size: 24px;
                  margin-bottom: 24px;
                }
                table {
                  width: 100%;
                  border-collapse: collapse;
                }
                th, td {
                  border: 1px solid #ccc;
                  padding: 12px;
                  text-align: left;
                }
              </style>
            </head>
            <body>
              <h1>法人向け見積書</h1>
              <table>
                <tr>
                  <th>会社名</th>
                  <td>${companyName}</td>
                </tr>
                <tr>
                  <th>シミュレーション送料</th>
                  <td>${totalPrice} 円</td>
                </tr>
              </table>
            </body>
          </html>
        `);
        previewWindow.document.close();
        previewWindow.focus();
        previewWindow.print();
        closeEstimateModal();
      });

      simulateButton.addEventListener("click", async () => {
        if (logOutput) {
          logOutput.textContent = "";
        }
        setInputError("");
        const isValidCountry = countryOptions.some(
          (country) => country.value === countryInput.value
        );
        const requiredInputs = [
          {
            field: countryInput,
            label: "送り先国",
            isInvalid: () => !isValidCountry,
          },
          {
            field: lengthInput,
            label: "サイズ（縦）",
            isInvalid: (value) => Number.isNaN(Number(value)),
          },
          {
            field: widthInput,
            label: "サイズ（横）",
            isInvalid: (value) => Number.isNaN(Number(value)),
          },
          {
            field: heightInput,
            label: "サイズ（高さ）",
            isInvalid: (value) => Number.isNaN(Number(value)),
          },
          {
            field: weightInput,
            label: "重さ",
            isInvalid: (value) => Number.isNaN(Number(value)),
          },
        ];
        const missingField = requiredInputs.find(({ field, isInvalid }) =>
          isInvalid(field.value)
        );
        if (missingField) {
          setInputError(`${missingField.label}を入力してください。`);
          return;
        }
        const result = calculate();
        if (result?.hasError) {
          setInputError(CARGO_INSURANCE_MESSAGE);
          logMessage("運送保険の金額が未入力のため送信を中断しました。");
          return;
        }

        const payload = {
          destinationCountry: countryInput.value,
          billableWeightKg: result?.billable,
          plan: planInput.value,
          inspectionCount: Number(inspectionInput.value || 0),
          packingCount: Number(packingInput.value || 0),
          exportCarton: exportCartonInput.checked,
          invoiceIssue: invoiceInput.checked,
          returnInsurance: returnInsuranceInput.checked,
          cargoInsurance: cargoInsuranceInput.checked,
          insuredValue: cargoInsuranceInput.checked
            ? Number(insuredValueInput.value || 0)
            : 0,
        };

        inputScreen.hidden = true;
        resultScreen.hidden = false;
        window.scrollTo({ top: 0, behavior: "smooth" });

        try {
          setSimulationPending();
          logMessage(`送信先URL: ${GAS_ENDPOINT}`);
          logMessage(`ブラウザ: ${navigator.userAgent}`);
          logMessage(`ページURL: ${window.location.href}`);
          logMessage(`送信データ: ${JSON.stringify(payload)}`);
          logMessage("GASに送信中...");
          const response = await fetch(GAS_ENDPOINT, {
            method: "POST",
            body: JSON.stringify(payload),
          });
          logMessage(`GAS応答: ${response.status} ${response.statusText}`);
          if (response.ok) {
            const responseText = await response.text();
            logMessage(`GAS応答本文: ${responseText}`);
            const data = responseText ? JSON.parse(responseText) : {};
            const shippingTotal = extractShippingTotal(data);
            if (typeof shippingTotal === "number") {
              totalOutput.textContent = formatNumber(shippingTotal);
              totalOutput.classList.remove("total-price-message");
              totalOutput.classList.remove("total-price-pending");
              totalUnit.textContent = "円";
            } else {
              totalOutput.textContent = "算出結果が取得できませんでした";
              totalOutput.classList.add("total-price-message");
              totalOutput.classList.remove("total-price-pending");
              totalUnit.textContent = "";
            }
          } else {
            const errorText = await response.text();
            logMessage(`GASエラー本文: ${errorText}`);
            totalOutput.textContent = "通信に失敗しました";
            totalOutput.classList.add("total-price-message");
            totalOutput.classList.remove("total-price-pending");
            totalUnit.textContent = "";
          }
        } catch (error) {
          console.error("GAS request failed", error);
          logErrorDetails("通信エラー", error);
          totalOutput.textContent = "通信に失敗しました";
          totalOutput.classList.add("total-price-message");
          totalOutput.classList.remove("total-price-pending");
          totalUnit.textContent = "";
          try {
            logMessage("no-cors モードで再送信を試行します...");
            const fallbackResponse = await fetch(GAS_ENDPOINT, {
              method: "POST",
              mode: "no-cors",
              body: JSON.stringify(payload),
            });
            logMessage(
              `no-cors 応答: type=${fallbackResponse.type} status=${fallbackResponse.status}`
            );
          } catch (fallbackError) {
            logErrorDetails("no-cors 再送信失敗", fallbackError);
          }
        }
      });
    </script>
  </body>
</html>
